<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moortneli4 | 个人网站</title>
  <meta name="description" content="Moortneli4 个人网站，包含个人介绍、作品与常用工具导航。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="badge">Portfolio</p>
      <h1>Moortneli4 个人网站</h1>
      <p class="subtitle">首版模板已上线，后续内容将持续更新。</p>
      <nav class="quick-links">
        <a href="#about">个人介绍</a>
        <a href="#works">个人作品</a>
        <a href="#scores">自制谱合集</a>
        <a href="#tools">个人小工具</a>
        <a href="#links">常用网站合集</a>
        <a href="#vault">神秘信息</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="about" class="card">
      <h2>个人介绍</h2>
      <p>这里将放置个人简介、经历与兴趣方向。</p>
    </section>

    <section id="works" class="card">
      <h2>个人作品</h2>
      <p>这里将按时间展示项目作品、Demo 链接和说明。</p>
    </section>

    <section id="scores" class="card">
      <h2>自制谱合集</h2>
      <p>这里将整理谱面目录，支持按主题检索与下载。</p>
    </section>

    <section id="tools" class="card">
      <h2>个人小工具</h2>
      <p>这里将放置日常自用工具入口与使用说明。</p>
    </section>

    <section id="links" class="card">
      <h2>常用网站合集</h2>
      <p>这里将维护高频站点导航与分类标签。</p>
    </section>

    <section id="vault" class="card">
      <h2>神秘信息（预留）</h2>
      <p>当前为占位区。后续将升级为更安全的访问控制方案。</p>
    </section>
  </main>

  <footer class="container footer">
    <p>© <span id="year"></span> Moortneli4. Built for GitHub Pages.</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
