name: Enable HTTPS when ready

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          state=$(echo "$pages" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log((j.https_certificate&&j.https_certificate.state)||'');});")
          enforced=$(echo "$pages" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.https_enforced?'yes':'no');});")
          echo "certificate_state=$state" >> "$GITHUB_ENV"
          echo "https_enforced=$enforced" >> "$GITHUB_ENV"
      - name: Enforce HTTPS
        if: env.certificate_state == 'issued' && env.https_enforced != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"moortneli4.top","https_enforced":true,"build_type":"legacy","source":{"branch":"main","path":"/"}}'
