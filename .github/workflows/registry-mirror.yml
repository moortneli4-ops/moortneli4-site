name: Mirror registry to Pages

on:
  push:
    branches: [registry]

permissions:
  contents: write

concurrency:
  group: registry-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          ref: registry
          path: registry
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Copy registry
        run: cp registry/id-registry.json site/data/id-registry.json
      - name: Commit
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/id-registry.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync ID registry for Pages"
          git push
